<!-- Shell contract: class="tab" data-tab=<id>, matching .view sections in
     body.html. Chat is the room; Settings is this chat, the projects and
     Symposium itself; Backend is a button for each sibling service, with
     the little widget that says whether it is there. -->
<button class="tab" data-tab="chat">Chat</button>
<button class="tab" data-tab="settings">Settings</button>
<button class="tab" data-tab="backend">Backend</button>
