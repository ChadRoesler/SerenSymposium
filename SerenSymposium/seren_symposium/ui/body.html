<section class="view" id="chat">
  <aside id="side"></aside>
  <div class="talk">
    <div class="bar" id="bar" hidden>
      <input class="title" id="title" placeholder="untitled" maxlength="120">
      <select id="move" title="move to another project"></select>
      <button class="ghost" id="gear" title="settings for this chat">settings</button>
      <button class="ghost" id="export" title="save this chat as JSON">export</button>
      <button class="ghost danger" id="del">delete</button>
    </div>
    <div class="settings" id="settings" hidden>
      <label for="s-voice">voice</label>
      <select id="s-voice"></select>
      <span></span><span></span>
      <label for="s-system_prompt">system</label>
      <textarea id="s-system_prompt"></textarea>
      <label for="s-model_override">model</label>
      <input id="s-model_override" list="models">
      <label for="s-temperature">temperature</label>
      <input id="s-temperature" type="number" step="0.05" min="0" max="2">
      <label for="s-max_tokens">max tokens</label>
      <input id="s-max_tokens" type="number" step="64" min="1">
      <label for="s-repeat_penalty">repeat penalty</label>
      <input id="s-repeat_penalty" type="number" step="0.05" min="0">
      <span class="note">Blank means the project's value (shown greyed). Saved as you leave each field.
        Temperature, max tokens and repeat penalty are for local models; claude keeps its own.</span>
      <datalist id="models"></datalist>
    </div>
    <div class="log" id="log"></div>
    <form id="composer">
      <textarea id="input" placeholder="Type a message… (Enter sends, Shift+Enter for a new line)"></textarea>
      <button class="primary send" id="send">Send</button>
    </form>
  </div>
</section>

<!-- Every viewer tab lands here: the sibling's own page in a frame. A group
     (Memory) gets a second row naming its members. -->
<section class="view" id="viewer">
  <nav class="subtabs" id="subtabs" hidden></nav>
  <iframe id="frame" title="viewer"></iframe>
</section>

<input type="file" id="importer" accept="application/json,.json" hidden>
